name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push supersedes an in-flight run. Without this, two pushes a minute
  # apart can deploy the backend out of order.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose. package.json declares
      # "packageManager": "pnpm@9.12.0", and passing a second, differently
      # shaped version to action-setup@v4 makes it refuse to guess — which
      # failed the job before a single step ran, so nothing was tested and
      # nothing deployed. One source of truth: package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The credential-free half of the staleness guard, and the one that
      # always runs. convex/_generated is COMMITTED, so if it is missing a
      # function that code references, this fails here rather than as a
      # confusing error inside a Next build later.
      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit

      # The thorough half, which DOES need credentials — contrary to what the
      # comment here used to claim. `npx convex codegen` refuses to run without
      # a configured deployment ("No CONVEX_DEPLOYMENT set"), and CI has no
      # .env.local, so it depends entirely on this secret. When the secret went
      # missing the whole pipeline failed here, nothing was tested, and the
      # deploy job was skipped — silently, for several commits.
      #
      # So: skip loudly rather than fail the run. A missing secret is a
      # configuration problem to fix, not a reason to stop testing the code.
      - name: Check generated Convex types are current
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::warning::CONVEX_DEPLOY_KEY is not set, so convex/_generated was not verified against convex/. Typecheck still ran."
            exit 0
          fi
          npx convex codegen
          git diff --exit-code -- convex/_generated \
            || (echo "::error::convex/_generated is stale. Run 'npx convex dev --once' and commit." && exit 1)

      # 155 tests, including the structural guards that are the only thing
      # stopping a future function from opting out of tenancy.
      - run: pnpm test

      - run: pnpm lint:tokens

      - run: pnpm --filter @cc/sites build
      - run: pnpm --filter @cc/office build

  deploy-backend:
    name: Deploy Convex
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose. package.json declares
      # "packageManager": "pnpm@9.12.0", and passing a second, differently
      # shaped version to action-setup@v4 makes it refuse to guess — which
      # failed the job before a single step ran, so nothing was tested and
      # nothing deployed. One source of truth: package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gated on `check` passing. A schema push that breaks tenancy is not
      # something to discover in production.
      - name: Deploy to Convex production
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
