name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push supersedes an in-flight run. Without this, two pushes a minute
  # apart can deploy the backend out of order.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version` here on purpose. package.json declares
      # "packageManager": "pnpm@9.12.0", and passing a second, differently
      # shaped version makes action-setup refuse to guess — which failed the
      # job before a single step ran, so nothing was tested and nothing
      # deployed. One source of truth: package.json.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The credential-free half of the staleness guard, and the one that
      # always runs. convex/_generated is COMMITTED, so if it is missing a
      # function that code references, this fails here rather than as a
      # confusing error inside a Next build later.
      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit

      # The thorough half, which DOES need credentials. `npx convex codegen`
      # refuses to run without a configured deployment ("No CONVEX_DEPLOYMENT
      # set"), and CI has no .env.local, so it depends entirely on this secret.
      #
      # On MAIN a missing secret is fatal. Main is what deploys, and it is the
      # same key the deploy job needs — so a rotated or expired one would
      # otherwise downgrade this guarantee to a warning nobody reads, which is
      # exactly how CI sat red for three commits unnoticed.
      #
      # On a pull request it warns instead: secrets are legitimately
      # unavailable to forked PRs, and failing those punishes a contributor for
      # a repo setting they cannot see. Typecheck runs either way, and that is
      # the check which catches a stale _generated that any code references.
      - name: Check generated Convex types are current
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            if [ "$IS_MAIN" = "true" ]; then
              echo "::error::CONVEX_DEPLOY_KEY is not set. On main this is fatal - it is the same secret the deploy job needs, so a missing or expired key means convex/_generated was never verified AND production was never updated."
              exit 1
            fi
            echo "::warning::CONVEX_DEPLOY_KEY is not available (expected on a forked PR), so convex/_generated was not verified against convex/. Typecheck still ran."
            exit 0
          fi
          npx convex codegen
          git diff --exit-code -- convex/_generated \
            || (echo "::error::convex/_generated is stale. Run 'npx convex dev --once' and commit." && exit 1)

      # 155 tests, including the structural guards that are the only thing
      # stopping a future function from opting out of tenancy.
      - run: pnpm test

      - run: pnpm lint:tokens

      - run: pnpm --filter @cc/sites build
      # apps/office/next.config.mjs THROWS on a production build without
      # CONVEX_URL, deliberately — a missing value would otherwise surface at
      # runtime after a green deploy. CI has no .env.local, so the guard fired
      # here and failed the run.
      #
      # This is a compile check, not the artifact anyone serves: Vercel builds
      # the real thing with the real value. So give it one, exactly as that
      # config says to ("to build without a backend on purpose, set CONVEX_URL
      # to anything"). A repo variable is used when set, so the check can run
      # against the true URL; the placeholder just keeps the compile honest.
      - run: pnpm --filter @cc/office build
        env:
          CONVEX_URL: ${{ vars.CONVEX_URL || 'https://ci-compile-check.convex.cloud' }}

  deploy-backend:
    name: Deploy Convex
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version` here on purpose. package.json declares
      # "packageManager": "pnpm@9.12.0", and passing a second, differently
      # shaped version makes action-setup refuse to guess — which failed the
      # job before a single step ran, so nothing was tested and nothing
      # deployed. One source of truth: package.json.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gated on `check` passing. A schema push that breaks tenancy is not
      # something to discover in production.
      - name: Deploy to Convex production
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
